<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="article">
<meta property="og:url" content="{{canonical}}">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="{{base_path}}/static/style.css">
</head>
<body class="{{body_class}}">
<header class="site-header">
  <a class="brand" href="{{base_path}}/">{{site_name}}</a>
  <nav class="nav">
    <a href="{{base_path}}/fukuen-shindan/">復縁診断</a>
    <a href="{{base_path}}/kare-honne-shindan/">彼の本音診断</a>
    <a href="{{base_path}}/aisho-shindan/">相性診断</a>
    <a href="{{base_path}}/denwa-uranai-erabikata/">電話占いの選び方</a>
  </nav>
</header>
<div class="pr-note">本サイトはプロモーション（広告）を含みます。占いは娯楽として楽しむものであり、結果を保証するものではありません。</div>
<main class="container">
  <article>
    <div class="meta"><span class="cat">{{category}}</span><time>{{date}}</time></div>
    {{content}}
  </article>
  <section class="related">
    <h2>関連記事</h2>
    <div class="cards">{{related}}</div>
  </section>
  <section class="related">
    <h2>無料診断</h2>
    <div class="cards">{{tools}}</div>
  </section>
</main>
<footer class="site-footer">
  <nav>
    <a href="{{base_path}}/about/">運営者情報</a>
    <a href="{{base_path}}/privacy/">プライバシーポリシー</a>
    <a href="{{base_path}}/disclaimer/">免責事項・広告について</a>
    <a href="{{base_path}}/contact/">お問い合わせ</a>
  </nav>
  <p>&copy; {{year}} {{site_name}}</p>
</footer>
</body>
</html>
